name: dart_lz4
description: High-performance pure Dart implementation of LZ4 and LZ4HC compression. Supports block and frame formats, streaming, dictionaries, and HC mode. Web-safe and dependency-free.
version: 1.2.0
repository: https://github.com/jxoesneon/dart_lz4
issue_tracker: https://github.com/jxoesneon/dart_lz4/issues
topics:
  - lz4
  - compression
  - streaming
  - lz4hc
  - codec

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:

dev_dependencies:
  async: ^2.13.0
  lints: ^6.1.0
  test: ^1.24.0
  analyzer: ">=12.1.0 <14.0.0"
