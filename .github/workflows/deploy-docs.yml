name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dart dependencies
        run: dart pub get

      - name: Generate Dart API Docs (Deep Markdown)
        run: |
          dart pub global activate dartdoc_vitepress
          # Fix missing .gitignore in pub cache that crashes dartdoc_vitepress
          mkdir -p /home/runner/.pub-cache/hosted/pub.dev/dartdoc_vitepress-1.2.1/lib/resources/vitepress
          touch /home/runner/.pub-cache/hosted/pub.dev/dartdoc_vitepress-1.2.1/lib/resources/vitepress/.gitignore
          
          # Generate to temp first
          dart pub global run dartdoc_vitepress:dartdoc_vitepress --format vitepress --output temp_api_docs
          
          # Flatten the structure: move temp_api_docs subfolders to website/docs/api
          mkdir -p website/docs/api
          # Move everything from temp_api_docs/api/ to website/docs/api/
          # This flattens the /api/api/ structure
          cp -r temp_api_docs/api/* website/docs/api/
          # Move the guide folder as well
          cp -r temp_api_docs/guide website/docs/api/
          # Move the root index.md from temp_api_docs to website/docs/api/
          cp temp_api_docs/index.md website/docs/api/index.md
          
          # Clean up and fix MDX for Docusaurus
          cd website
          node fix-mdx.js
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Docusaurus dependencies
        working-directory: ./website
        run: npm ci

      - name: Build Docusaurus site
        working-directory: ./website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          commit_message: 'docs: auto-deploy institution site [skip ci]'
